name: container-images

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

env:
  IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    if: github.repository == 'tales-media/cli'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - talesctl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          # containerd image store allows to load multi-platform images
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          platforms: ${{ env.IMAGE_PLATFORMS }}

      - name: info
        run: |
          docker version
          docker info

      - name: set tag version
        id: version
        run: |
          VERSION=dev
          if [ "${{ github.ref_type }}" = 'tag' ]; then
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=${VERSION}" | tee -a "$GITHUB_OUTPUT"

      - name: build and push container images
        run: |
          case "${{ github.event_name }}" in
            push)  BUILDX_OUTPUT='--push' ;;
               *)  BUILDX_OUTPUT='--load' ;;
          esac

          make image-${{ matrix.image }} \
            VERSION=${{ steps.version.outputs.VERSION }} \
            IMAGE_PLATFORMS=${{ env.IMAGE_PLATFORMS }} \
            BUILDX_OUTPUT="${BUILDX_OUTPUT}"
